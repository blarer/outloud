[package]
name = "ax-edit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# Internal workspace crate: never published to crates.io. This also lets
# `cargo deny` treat path dependencies as first-party rather than as
# unversioned wildcards.
publish = false
description = "Read and rewrite focused text fields via the macOS Accessibility API"

[features]
default = []
# Resolve an app's bundle identifier, which needs AppKit. Off by default
# because a headless build must not link a GUI framework: preflight's
# headless gate fails the build if it does. The daemon enables it; a
# headless consumer loses bundle ids and matches on process name.
bundle-id = ["dep:objc2", "dep:objc2-app-kit"]

[dependencies]
anyhow.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = "0.1"
core-foundation = "0.10"
core-foundation-sys = "0.8"
libc = "0.2.189"
# NSRunningApplication, for pid -> bundle identifier. Profiles match on
# bundle ids because they are stable and unique; a window title is neither.
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", features = ["NSRunningApplication"], optional = true }

# Benchmarks measure real IPC into other processes, so criterion is a
# dev-dependency only and never ships in the product binary.
[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
# The regression gate reuses diag's Recorder/percentile machinery so CI and
# the doctor report identical numbers. A dev-dependency cycle (diag depends
# on ax-edit) is fine: cargo resolves dev-dependencies separately.
diag = { path = "../diag" }

[[bench]]
name = "ax_latency"
harness = false

# The regression gate is a plain binary with a pass/fail exit code, not a
# criterion harness, so CI can run it directly: cargo bench -p ax-edit --bench gate
[[bench]]
name = "gate"
harness = false
