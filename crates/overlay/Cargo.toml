[package]
name = "overlay"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# Internal workspace crate: never published to crates.io. This also lets
# `cargo deny` treat path dependencies as first-party rather than as
# unversioned wildcards.
publish = false
description = "The dictation overlay: a non-activating floating indicator showing live state, audio level, and partial text"

[features]
# Everything a desktop session can use. Default because that is the common case.
default = ["display"]

# The actual GUI window. Mirrors the `display` gate in text-target: building
# without this is a correctness gate for headless machines, not an
# optimization. A headless server has no AppKit to link against, so the
# overlay must compile down to the pure state machine and layout math (which
# the terminal/OSC indicator surfaces still consume) with zero GUI linkage.
display = [
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-app-kit",
    "dep:block2",
    "dep:windows",
]

[dependencies]
anyhow.workspace = true

# All GUI dependencies are doubly gated: by target (only macOS has AppKit)
# and by the `display` feature (headless builds must not link it even on
# macOS, so `--no-default-features` stays a workspace-wide guarantee).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true, features = [
    "NSDate",
    "NSDictionary",
    "NSString",
    "NSTimer",
    "NSThread",
] }
objc2-app-kit = { version = "0.3", optional = true, features = [
    "NSApplication",
    "NSAttributedString",
    "NSBezierPath",
    "NSButton",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSEvent",
    "NSFont",
    # NSImageSymbolConfiguration (point size + weight + scale) ships inside
    # the NSImage feature, but its weight argument is an NSFontDescriptor
    # type, so that feature has to be named too. Without it the status item
    # glyph would be a fixed bitmap and wrong on most menu bar heights.
    "NSFontDescriptor",
    "NSGradient",
    "NSGraphics",
    "NSGraphicsContext",
    "NSShadow",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSPanel",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    # The menu-bar presence: without a status item a LSUIElement daemon is
    # invisible and unquittable. See src/status_item.rs.
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSStringDrawing",
    "NSView",
    "NSWindow",
] }
block2 = { version = "0.6", optional = true }

[[bin]]
name = "overlay-demo"
path = "src/bin/overlay-demo.rs"

# The menu-bar item, demonstrable on its own so "does the icon appear and can
# I click it" is answerable without building the whole daemon.
[[bin]]
name = "status-demo"
path = "src/bin/status-demo.rs"

# Windows overlay: layered/click-through/non-activating window, rendered
# with Direct2D/DirectWrite into the same premultiplied-alpha DIB the
# layered window already uses (see windows.rs's module doc). Same double
# gating as the AppKit dependencies above: only Windows targets download
# it, only display builds link it.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    # Direct2D: fills the skull's arbitrary polygons with alpha-blended
    # solid/gradient brushes, which GDI cannot do natively (see
    # docs/plans/windows-overlay.md §2.1). `ID2D1DCRenderTarget` binds to
    # the existing GDI memory DC, so the window-plumbing half of this file
    # is unchanged; only what draws *into* the DC changes.
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    # DirectWrite: the skull's text-lane analog of `NSFont`/`NSString`
    # measurement and drawing (§2.6). Not wired into a renderer yet at
    # Stage 0-2; the feature is added now so Stage 3 (text lane) is a pure
    # code change with no Cargo-plumbing risk left to discover.
    "Win32_Graphics_DirectWrite",
    # Pixel format enums (`DXGI_FORMAT_B8G8R8A8_UNORM`) Direct2D's render
    # target creation wants.
    "Win32_Graphics_Dxgi_Common",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

# A perf gate rather than a criterion benchmark: criterion answers "how
# fast", this answers "still fast enough" with an exit code CI can act on.
# `harness = false` because it has its own main and no test harness.
[[bench]]
name = "perf_gate"
harness = false

[dev-dependencies]
# The gate measures the intent parser alongside the overlay, since both sit
# between the user's voice and their text and neither is covered by a
# correctness test getting slower.
edit-intent = { path = "../edit-intent" }
