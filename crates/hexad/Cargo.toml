[package]
name = "hexad"
version.workspace = true
edition.workspace = true
license.workspace = true
# Internal workspace crate: never published to crates.io. This also lets
# `cargo deny` treat path dependencies as first-party rather than as
# unversioned wildcards.
publish = false
description = "The dictation daemon: hotkey -> capture -> VAD -> recognizer -> intent -> write, wired end to end"

[features]
# Desktop build: the GUI overlay plus the display transports. Default because
# that is what a user runs. Mirrors the `display` gate in text-target and
# overlay so `--no-default-features` stays a workspace-wide headless guarantee.
default = ["display"]
# `audio/capture` rides on `display` because they answer the same question:
# is there a human at this machine? A desktop build needs a microphone and a
# window; a headless build has neither, takes its audio from --wav or a
# socket, and must not link an audio stack (alsa-sys on Linux) it never
# calls. Keeping capture on a separate feature would let someone build a
# "headless" daemon that still drags in ALSA, which is the bug this closes.
display = ["overlay/display", "text-target/display", "audio/capture"]

[dependencies]
anyhow.workspace = true
asr = { path = "../asr" }
# default-features = false, so `--no-default-features` genuinely reaches the
# audio crate. Without this the dependency edge re-enables `capture` no
# matter what the build command says, which is exactly how the musl CI rows
# kept pulling alsa-sys after capture was made optional.
audio = { path = "../audio", default-features = false }
ax-edit = { path = "../ax-edit" }
# The menu bar's Settings items are a view over config.toml: every change is
# written through config::update_file, never into a parallel store.
config = { path = "../config" }
diag = { path = "../diag" }
edit-intent = { path = "../edit-intent" }
hotkey = { path = "../hotkey" }
overlay = { path = "../overlay", default-features = false }
text-target = { path = "../text-target", default-features = false }
# rt-multi-thread because the pipeline stages (recognizer thread, injection)
# are blocking work that must not stall the async supervisor; time for the
# transcribing-elapsed ticker; sync for the watch/mpsc/oneshot channel set.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }

# `flock`, for the single-instance guard. One libc call rather than a crate:
# the alternative designs all reduce to parsing a pid file, which cannot
# distinguish a live daemon from a dead one whose pid has been reused.
[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

# The overlay itself needs a main-thread AppKit run loop; the daemon hosts it.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSDate", "NSRunLoop"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder"] }
block2 = "0.6"
