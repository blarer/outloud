[package]
name = "diag"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# Internal workspace crate: never published to crates.io. This also lets
# `cargo deny` treat path dependencies as first-party rather than as
# unversioned wildcards.
publish = false
description = "Environmental diagnostics: turn confusing failures into named next actions"

[features]
# On by default so `doctor` can actually answer "is there a microphone".
#
# Optional at all because cpal is the one dependency here that needs a system
# audio stack (ALSA headers via pkg-config on Linux), and a headless build
# must be able to typecheck diagnostics without one. Same gate, same reason,
# as `audio/capture` itself.
default = ["audio-probe"]
audio-probe = ["dep:audio"]

[dependencies]
# Path policy only: the doctor must probe the same model directory the
# daemon actually reads, which is what a hand-copied path got wrong before.
config = { path = "../config" }
anyhow.workspace = true
# Only for the accessibility trust probe; diag never edits text itself.
ax-edit = { path = "../ax-edit" }
# Only for the Input Monitoring probe; diag never binds a hotkey itself.
hotkey = { path = "../hotkey" }
# Only to ENUMERATE input devices for the audio-input check. The doctor never
# opens a stream: asking "does a device exist" must not take the microphone
# from the daemon, and must not light the recording indicator.
[target.'cfg(windows)'.dependencies]
audio = { path = "../audio", optional = true }

[[bin]]
name = "doctor"
path = "src/bin/doctor.rs"
