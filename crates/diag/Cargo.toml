[package]
name = "diag"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# Internal workspace crate: never published to crates.io. This also lets
# `cargo deny` treat path dependencies as first-party rather than as
# unversioned wildcards.
publish = false
description = "Environmental diagnostics: turn confusing failures into named next actions"

[dependencies]
# Path policy only: the doctor must probe the same model directory the
# daemon actually reads, which is what a hand-copied path got wrong before.
config = { path = "../config" }
anyhow.workspace = true
# Only for the accessibility trust probe; diag never edits text itself.
ax-edit = { path = "../ax-edit" }
# Only for the Input Monitoring probe; diag never binds a hotkey itself.
hotkey = { path = "../hotkey" }

[[bin]]
name = "doctor"
path = "src/bin/doctor.rs"
