[package]
name = "audio"
version.workspace = true
edition.workspace = true
license.workspace = true
# Internal workspace crate: never published to crates.io. This also lets
# `cargo deny` treat path dependencies as first-party rather than as
# unversioned wildcards.
publish = false
description = "Microphone capture, resampling, VAD, and speech segmentation for the recognizer pipeline"

[features]
default = []
# Silero VAD via the vad-rs crate (pulls ONNX Runtime). Off by default so CI
# and contributors without the ~50MB ort download still build and test the
# whole segmenter state machine, which is VAD-implementation-agnostic.
#
# Build notes for `--features silero`:
# - needs `cmake` on PATH (vad-rs pulls libsamplerate-sys), and old CMakeLists
#   there may need CMAKE_POLICY_VERSION_MINIMUM=3.5 with cmake 4.x;
# - Cargo.lock pins ort-sys to 2.0.0-rc.9 to match vad-rs's ort 2.0.0-rc.9;
#   letting it float to rc.12 breaks the build (ort-sys rc.11+ requires a TLS
#   feature that ort rc.9 does not forward). Build with --locked.
silero = ["dep:vad-rs"]

[dependencies]
anyhow = { workspace = true }
cpal = "0.18"
crossbeam-channel = "0.5"
thiserror = "2"
vad-rs = { version = "0.1", optional = true }

[dev-dependencies]
# Only used by ignored hardware tests; synthetic-audio tests need nothing.
