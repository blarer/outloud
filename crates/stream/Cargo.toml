[package]
name = "stream"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Streaming text commit layer: stability horizon, minimal diffs, coalescing, degradation, undo ring, backpressure"

[dependencies]
# Grapheme- and word-boundary segmentation (UAX #29). We segment by
# *extended grapheme clusters* so a diff can never split an emoji ZWJ
# sequence or a combining mark from its base, and by UAX #29 word
# boundaries so CJK text (which has no spaces) still gets sensible edit
# units instead of one giant "word".
unicode-segmentation = "1"

[dev-dependencies]
proptest = "1"
