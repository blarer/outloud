[package]
name = "asr"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# Internal workspace crate: never published to crates.io. This also lets
# `cargo deny` treat path dependencies as first-party rather than as
# unversioned wildcards.
publish = false
description = "Streaming speech recognition: trait, backends, two-stage pipeline, model manager"

[features]
# Off by default: whisper-rs builds whisper.cpp from source and needs cmake
# plus a C++ toolchain. A default-on native build would break `cargo build`
# for anyone without those, including CI jobs that only want to typecheck.
whisper = ["dep:whisper-rs"]
# GPU acceleration for whisper. Pick the one your machine has; none is a
# valid choice and falls back to CPU.
#
# Why this matters: whisper-rs enables Metal automatically on macOS but
# nothing on Windows or Linux, so an unaccelerated build is CPU-only. Measured
# on a Ryzen 9 9950X3D with base.en, a 5s utterance took 8970ms on CPU against
# 255ms on an M4 Pro with Metal. That is not a slow machine, it is an idle
# GPU, and 9s of latency makes dictation unusable.
whisper-cuda = ["whisper-rs/cuda"]      # NVIDIA
whisper-vulkan = ["whisper-rs/vulkan"]  # AMD, Intel, and NVIDIA without CUDA

[dependencies]
# Path policy only: one crate decides where model weights live, so the
# recognizer, the LLM and the doctor cannot disagree about the directory.
config = { path = "../config" }
anyhow = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
ureq = "2"
# Bindings to whisper.cpp. Optional: see the `whisper` feature above.
whisper-rs = { version = "0.16", optional = true, default-features = false }
