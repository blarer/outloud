# Configuration for `cross` (https://github.com/cross-rs/cross), used only for
# the Linux aarch64 rows of the release matrix.
#
# WHY cross and not plain rustup targets: rustup gives us the Rust std for the
# target, but a C toolchain, linker, and sysroot still have to come from
# somewhere. cross ships them in pinned container images, which is both less
# host-machine setup and more reproducible than whatever gcc-aarch64 package a
# runner happens to have. x86_64 Linux (glibc and musl) builds natively on the
# ubuntu runner and does not go through cross at all.
#
# WHY images are pinned by digest-tag rather than "latest": an image bump can
# silently change the glibc floor of the produced binary. Bumps happen in
# their own PR, like toolchain bumps.

[build]
# Fetch on the host with the host's git/credentials, then hand vendored
# sources to the container. Avoids network access from inside the build
# container, which is one less variable for reproducibility.
default-target = "x86_64-unknown-linux-gnu"

[build.env]
# Reproducibility variables must cross the container boundary or the
# container build and the host build stop being comparable.
passthrough = ["SOURCE_DATE_EPOCH", "RUSTFLAGS", "CARGO_INCREMENTAL", "PKG_CONFIG_ALLOW_CROSS", "PKG_CONFIG_PATH"]

[target.aarch64-unknown-linux-gnu]
# Ubuntu 20.04-based image => glibc 2.31 floor for shipped aarch64 binaries.
# That covers Debian 11+, Ubuntu 20.04+, RHEL 9+. Raising this floor is a
# user-visible compatibility change; treat like an MSRV bump.
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:0.2.5"
# alsa-sys needs the *target-arch* ALSA headers/libs inside the container.
# The image is x86_64 Ubuntu 20.04; arm64 packages live on ports.ubuntu.com,
# which is not in the default sources, so it is added here for arm64 only.
pre-build = [
    "dpkg --add-architecture arm64",
    "sed -i 's/^deb http/deb [arch=amd64] http/' /etc/apt/sources.list",
    "echo 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal main universe' >> /etc/apt/sources.list",
    "echo 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal-updates main universe' >> /etc/apt/sources.list",
    # focal-security must be listed too: focal-updates packages routinely
    # depend on exact versions published through security (the observed
    # failure was libasound2:arm64 -> libc6:arm64 >= 2.29 "not going to be
    # installed", because the resolvable libc6 lived in focal-security).
    "echo 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal-security main universe' >> /etc/apt/sources.list",
    # Extract, don't install: apt refuses to install any arm64 library into
    # this 2020-era image because every Multi-Arch: same pair (libc6,
    # libcrypt1, gcc-10-base, ...) must match the amd64 copy byte-for-byte,
    # and no amount of upgrade/dist-upgrade converges (tried; each run
    # failed one library deeper). We do not need a coherent arm64 userland,
    # only ALSA's headers, .so symlink, and alsa.pc for the LINK step; the
    # aarch64 sysroot glibc that resolves the final link ships with the
    # cross toolchain itself. `apt-get download` + `dpkg -x /` lays the
    # files down with no dependency resolution at all.
    "apt-get update && apt-get install -y pkg-config",
    "cd /tmp && apt-get download libasound2:arm64 libasound2-dev:arm64 && for f in /tmp/libasound2*.deb; do dpkg -x \"$f\" /; done",
]

[target.aarch64-unknown-linux-musl]
# Musl target is fully static (see .cargo/config.toml), so the image choice
# affects only the build environment, not the runtime floor of the binary.
image = "ghcr.io/cross-rs/aarch64-unknown-linux-musl:0.2.5"
