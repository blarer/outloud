# Release pipeline: tag v* -> build, sign, notarize, package, SBOM, publish.
#
# Signing steps are guarded by secret presence so a fork (or a tag pushed
# before certificates exist) still produces unsigned-but-labelled artifacts
# instead of a red pipeline. Real releases require the secrets:
#   macOS:   MACOS_CERT_P12 (base64), MACOS_CERT_PASSWORD,
#            MACOS_SIGN_IDENTITY, APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD
#   Windows: WINDOWS_CERT_PFX (base64), WINDOWS_CERT_PASSWORD

name: release

on:
  push:
    tags: ["v*"]
  # Manual dry-run of the whole pipeline without tagging; artifacts are
  # uploaded but no GitHub Release is created.
  workflow_dispatch:

permissions:
  contents: write   # create the GitHub Release

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Gate: a release must never ship what CI would have rejected.
  compliance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: compliance
          cache-all-crates: "true"
      - run: scripts/ci-check.sh
        shell: bash
      - run: scripts/ci-compliance.sh
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: dist/sbom/

  macos:
    needs: compliance
    runs-on: macos-15
    env:
      # Evaluated here because `secrets` is unavailable in step-level `if:`.
      HAVE_MACOS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
      HAVE_APPLE_NOTARY: ${{ secrets.APPLE_APP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos
      - name: Import Developer ID certificate
        # Secrets are unavailable in forks, so this must skip rather than fail.
        # The check reads a job-level env var because the `secrets` context is
        # not available to step-level `if:` conditions.
        if: env.HAVE_MACOS_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          # Ephemeral keychain: the cert exists only for this job and dies
          # with the runner. Never imported into the login keychain.
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Store notarytool credentials
        if: env.HAVE_APPLE_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials release-profile \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"
          echo "MACOS_NOTARY_PROFILE=release-profile" >> "$GITHUB_ENV"
      - name: Build, sign, notarize, package
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: scripts/build-macos-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: dist/*.dmg

  windows:
    needs: compliance
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    runs-on: windows-2025
    env:
      HAVE_WINDOWS_CERT: ${{ secrets.WINDOWS_CERT_PFX != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          # Keyed on the build script, in `shared-key` rather than `key`.
          #
          # whisper.cpp is compiled by a build script into a static library
          # in the cargo target dir, which rust-cache saves and restores.
          # Cargo does not know this script chose the cmake settings it was
          # built with, so editing them invalidates nothing: the cached
          # library comes back and the new settings apply to nothing.
          #
          # Observed, not theorised. A `GGML_NATIVE=OFF` change echoed its
          # own log line here and the baseline guard still found 12703
          # post-baseline instructions, because whisper-rs-sys was never
          # recompiled. It has to be `shared-key`: rust-cache derives its
          # restore keys from that, so a changed `key` still matches the old
          # entry by prefix. Watch for `Compiling whisper-rs-sys` in the log.
          shared-key: release-${{ matrix.target }}-${{ hashFiles('scripts/build-windows.sh') }}
      - name: Import Authenticode certificate
        if: env.HAVE_WINDOWS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $pw = ConvertTo-SecureString $env:WINDOWS_CERT_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx
          "WINDOWS_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -Append $env:GITHUB_ENV
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Build and package
        shell: bash
        run: scripts/build-windows.sh ${{ matrix.target }}
      - name: Verify x86-64 ISA baseline (pre-Haswell guard)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        # objdump ships with the Git-for-Windows/MSYS toolchain on runners.
        #
        # Both binaries. This checked only the harness until 2026-10-30, so
        # the daemon, which is the one that links whisper.cpp and therefore
        # the one that can inherit ggml's AVX2 tuning, shipped unexamined
        # from the day the recognizer was added to this script. The Linux
        # equivalent of this gap, found the same day, reported 4870
        # post-baseline instructions in the daemon.
        run: |
          scripts/ci-verify-baseline.sh dist/windows/${{ matrix.target }}/outloud-spike.exe
          scripts/ci-verify-baseline.sh dist/windows/${{ matrix.target }}/outloud.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.target }}
          path: |
            dist/windows/${{ matrix.target }}/*.zip
            dist/windows/${{ matrix.target }}/*.exe
            dist/windows/${{ matrix.target }}/*.msi

  linux:
    needs: compliance
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          # Keyed on the build script for the same reason as the Windows job
          # above: a cached libwhisper.a makes a cmake-setting change a no-op,
          # and `shared-key` is what rust-cache builds its restore keys from.
          shared-key: release-${{ matrix.target }}-${{ hashFiles('scripts/build-linux.sh') }}
      - name: Install packaging tools
        run: |
          sudo apt-get update
          # desktop-file-utils supplies desktop-file-validate, which
          # appimagetool shells out to and refuses to run without. Omitting
          # it failed all three Linux jobs of the v0.1.0 release AFTER every
          # other platform had built successfully, with the only clue being
          # "desktop-file-validate command is missing" 200 lines into a log.
          # cmake builds whisper.cpp from source, which the daemon needs on
          # glibc targets. Added when build-linux.sh started shipping the
          # daemon rather than only the harness: before that, nothing in the
          # Linux release path compiled a recognizer.
          sudo apt-get install -y musl-tools rpm binutils desktop-file-utils cmake
          # appimagetool: single static binary, pinned release.
          curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
      - name: Build and package
        run: scripts/build-linux.sh ${{ matrix.target }}
      # The guard reads the binary a USER runs. It checked only the harness
      # until the daemon started shipping here, which left the artifact that
      # actually links whisper.cpp unexamined for AVX2 in a static
      # initializer: exactly the pre-Haswell crash class the script exists
      # for, on the one binary most likely to carry it.
      - name: Verify x86-64 ISA baseline (pre-Haswell guard)
        if: startsWith(matrix.target, 'x86_64')
        run: |
          scripts/ci-verify-baseline.sh dist/linux/${{ matrix.target }}/outloud-spike
          # musl ships no daemon (no ALSA for the target); see build-linux.sh.
          if [ -f dist/linux/${{ matrix.target }}/outloud ]; then
            scripts/ci-verify-baseline.sh dist/linux/${{ matrix.target }}/outloud
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}
          path: |
            dist/linux/${{ matrix.target }}/*.tar.gz
            dist/linux/${{ matrix.target }}/*.AppImage
            dist/linux/${{ matrix.target }}/*.deb
            dist/linux/${{ matrix.target }}/*.rpm
            dist/linux/${{ matrix.target }}/*.yml

  headless:
    needs: compliance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-headless
      - name: Build static headless daemons
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          scripts/build-headless.sh x86_64-unknown-linux-musl
          cargo install cross --locked
          scripts/build-headless.sh aarch64-unknown-linux-musl || true
      - uses: actions/upload-artifact@v4
        with:
          name: headless
          path: dist/headless/

  publish:
    # workflow_dispatch runs stop here: artifacts exist, no release created.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux, headless]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # The double-click installer is a source file, not a build output, so
      # nothing in the matrix produces it and it was absent from every
      # release. The one attached to v2026.08.06-1649 was uploaded by hand
      # and fetched install.sh from a feature branch; the next release would
      # simply have dropped the install path the notes recommend first.
      - uses: actions/checkout@v4
        with:
          path: repo
      - name: Attach the double-click installer
        run: cp repo/scripts/Install-OutLoud.command artifacts/
      - name: Refuse to publish an installer pinned to a branch
        # A release is the one artifact nobody re-reads before strangers use
        # it. This is the defect that broke the last one.
        run: |
          if grep -q 'raw.githubusercontent.com/[^"]*refs/heads/' artifacts/Install-OutLoud.command; then
            grep -n 'refs/heads/' artifacts/Install-OutLoud.command
            echo "::error title=installer pinned to a branch::Install-OutLoud.command fetches install.sh from a branch ref. Use /main/, or the installer breaks when that branch is deleted."
            exit 1
          fi
      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f ! -name 'SHA256SUMS' -exec shasum -a 256 {} \; > SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true   # a human sanity-checks artifacts before publishing
          # Written here rather than by hand on the release page. The
          # hand-written notes on the last release pointed at a feature
          # branch, and nothing could notice: notes are not code, so no
          # check ever read them. Generating them from the workflow means
          # the install instructions are reviewed like everything else.
          #
          # These notes cover EVERY platform the matrix above uploads. They
          # described only the macOS double-click installer until
          # 2026-10-30, while the same release attached Windows zips, an
          # NSIS installer, Linux packages and a static headless binary. A
          # Windows user downloading `outloud-*-x86_64-pc-windows-msvc.zip`
          # was told to double-click a `.command` file. If a job is added to
          # or removed from the matrix, this body is part of the change.
          body: |
            ### macOS (Apple Silicon, macOS 26+)

            Download **Install-OutLoud.command** below, then double-click it.

            The first time, macOS may say it is from an unidentified
            developer. Right-click the file and choose **Open**, then
            **Open** again. That prompt is expected: these builds are
            **not notarized**, so Gatekeeper has nothing to check them
            against.

            <details><summary>Terminal alternative</summary>

            ```
            curl -fsSL https://raw.githubusercontent.com/blarer/outloud/main/scripts/install.sh | bash
            ```

            macOS 26 may block pasting this; the download above avoids that.
            </details>

            ### Windows (x86_64 and ARM64)

            Either the `-setup.exe` installer or the `.zip` if you would
            rather not install anything. Both contain `outloud.exe`, the
            daemon, and `outloud-spike.exe`, a diagnostic harness.

            **These binaries are unsigned.** SmartScreen will warn, and
            some antivirus software may quarantine them, because a tool
            that synthesizes keyboard input looks exactly like something
            that should be viewed with suspicion. Choose **More info** then
            **Run anyway** if you trust this source. We would rather say so
            than have you discover it.

            A whisper model is fetched on first use (~148MB, SHA256-pinned).
            Dictation, undo and the hotkey are verified on real hardware;
            the on-screen overlay's appearance is not.

            ### Linux (x86_64 and aarch64, glibc and musl)

            `.deb`, `.rpm`, AppImage or the tarball. Each contains
            `outloud`, the dictation daemon, and `outloud-spike`, a
            diagnostic harness.

            Until 2026-10-30 these packages shipped only the harness, so
            installing one gave you no way to dictate: the same defect
            `36bb9fe` fixed for Windows, in the one place it was not also
            fixed. If you have an older package, that is why it did nothing.

            Text delivery goes through the `RemoteDesktop` desktop portal,
            so a session without that portal has no way to type, and
            push-to-talk needs a compositor that can bind both key edges.
            Hyprland, sway and river can; GNOME cannot, and there you bind
            one shortcut to `outloud trigger toggle` instead. Nobody has yet
            dictated end to end on Linux, so treat it as untested rather
            than working.

            ### Headless / SSH

            `outloud-spiked-*` is a static musl build with no audio or
            display dependencies. Note this one is still built from
            `spike-cli`: it is the harness, for the daemon-over-socket path,
            not the dictation daemon.

            ---

            `SHA256SUMS` below covers every file in this release.
          files: |
            artifacts/**/*
